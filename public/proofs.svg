<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Two proofs side by side: a short one and a long one">
  <rect width="640" height="360" fill="#001d36"/>
  <rect x="92" y="70" width="190" height="200" rx="10" fill="#ffffff"/>
  <g stroke="#001d36" stroke-width="10" stroke-linecap="round">
    <line x1="122" y1="118" x2="252" y2="118"/><line x1="122" y1="152" x2="220" y2="152"/>
  </g>
  <text x="187" y="236" fill="#001d36" font-family="serif" font-size="34" text-anchor="middle">∎</text>
  <rect x="358" y="40" width="190" height="260" rx="10" fill="#ffffff"/>
  <g stroke="#001d36" stroke-width="10" stroke-linecap="round">
    <line x1="388" y1="78" x2="518" y2="78"/><line x1="388" y1="108" x2="500" y2="108"/>
    <line x1="388" y1="138" x2="518" y2="138"/><line x1="388" y1="168" x2="470" y2="168"/>
    <line x1="388" y1="198" x2="518" y2="198"/><line x1="388" y1="228" x2="490" y2="228"/>
  </g>
  <text x="453" y="282" fill="#001d36" font-family="serif" font-size="30" text-anchor="middle">∎</text>
  <text x="320" y="340" fill="#9fb3c8" font-family="sans-serif" font-size="22" text-anchor="middle">which explains better?</text>
</svg>
