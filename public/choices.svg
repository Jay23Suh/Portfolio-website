<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Two framings of the same choice">
  <rect width="640" height="360" fill="#001d36"/>
  <rect x="70" y="95" width="220" height="140" rx="16" fill="#ffffff"/>
  <text x="180" y="155" fill="#001d36" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">200 saved</text>
  <text x="180" y="195" fill="#001d36" font-family="sans-serif" font-size="20" text-anchor="middle">for sure</text>
  <rect x="350" y="95" width="220" height="140" rx="16" fill="#9fb3c8"/>
  <text x="460" y="155" fill="#001d36" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">400 lost</text>
  <text x="460" y="195" fill="#001d36" font-family="sans-serif" font-size="20" text-anchor="middle">for sure</text>
  <text x="320" y="172" fill="#9fb3c8" font-family="sans-serif" font-size="26" text-anchor="middle">=</text>
  <text x="320" y="320" fill="#9fb3c8" font-family="sans-serif" font-size="22" text-anchor="middle">same choice, different words</text>
</svg>
